<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>
<body>
  <div class="calculator">
    <div class="displayResult">
    </div>
      <div class="specialbuttons">
        <button class="specialbtn" onclick="allClear()">AC</button>
        <button class="specialbtn" onclick="Clear()">CLEAR</button>
      </div>
    <div class="buttons">
      <div class="normal button">1</div>
      <div class="normal button">2</div>
      <div class="normal button">3</div>
      <div class="special button">+</div>
      <div class="normal button">4</div>
      <div class="normal button">5</div>
      <div class="normal button">6</div>
      <div class="special button">-</div>
      <div class="normal button">7</div>
      <div class="normal button">8</div>
      <div class="normal button">9</div>
      <div class="special button">*</div>
      <div class="normal button">.</div>
      <div class="normal button">0</div>
      <div class="button" onclick="equalTo()">=</div>
      <div class="special button">/</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
